# 로컬 개발용 인프라 + 풀스택 데모(backend/frontend).
services:
  postgres:
    image: postgres:16-alpine
    # 이 3개 값은 .env 의 DATABASE_URL(postgres://ir:ir@localhost:5432/incident_radar)과 맞춰야 한다.
    environment:
      POSTGRES_USER: ir
      POSTGRES_PASSWORD: ir
      POSTGRES_DB: incident_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ir -d incident_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      # .env 는 로컬 개발용(NODE_ENV=development, host 기준 localhost) 값이라 컨테이너에선 덮어쓴다.
      NODE_ENV: production
      DATABASE_URL: postgres://ir:ir@postgres:5432/incident_radar
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # 브라우저에서 직접 호출하는 주소라 호스트 매핑 포트(localhost:3000) 그대로 사용.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  pgdata:
