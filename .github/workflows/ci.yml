name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # backend 의 test 스크립트가 docker-compose.test.yml 로 Postgres·Redis 를
      # 띄우고 마이그레이션까지 실행한다 (ubuntu-latest 러너에 Docker 기본 설치됨).
      - run: pnpm test
